{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}

<form method="POST">
    {{ form.hidden_tag() }}
    {{ form.title.label }}
    {{ form.title(size=40) }}
</form>


{% block content %}
<div class="container mt-4">
    <h1>Login to Continue</h1>
    {{ render_form(form,
                   method='post', button_style='success') }}

</div>
{% endblock %}
